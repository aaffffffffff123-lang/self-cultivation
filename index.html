/* 이름은 옷에 적히는 글씨라 「옷·체형」 탭 안으로 옮겼다. 전용 줄을 없애 조작 영역을 넓혔다. */
.look-name-field input{width:100%;height:46px;padding:0 12px;border:2px solid #97bfb3;border-radius:10px;background:#fff;color:var(--ink);font:700 16px var(--body);user-select:text;-webkit-user-select:text;touch-action:manipulation}
.look-name-field input:focus{outline:2px solid var(--care);outline-offset:1px}
#lookNameParking[hidden],#lookSaveParking[hidden]{display:none}
#ngNameHeading:focus{outline:none}
body #lookCancel{display:inline-flex!important;align-items:center;justify-content:center;flex:0 0 auto;width:auto!important}
body .look-footer-actions #lookApply{min-width:0!important;width:auto!important;flex:1}
body .look-footer .look-history button{width:36px;min-width:36px;padding:0 5px}
.look-narrow-label{display:none}
@media(max-width:900px) and (orientation:portrait),(max-width:600px){.look-wide-label{display:none}.look-narrow-label{display:inline}}
.ng-intro-card{width:min(100%,410px);padding:30px 24px 26px;background:var(--paper);border:3px solid var(--ink);border-radius:25px;box-shadow:7px 8px 0 var(--ink)}
.ng-intro-card h1{font:400 clamp(34px,9vw,46px)/1.15 var(--display);margin:0 0 26px;letter-spacing:-1px}
.ng-intro-card label{display:block;font:800 12px var(--body);color:var(--muted);margin-bottom:9px}
.ng-intro-card input{width:100%;height:57px;background:#fff;border:2.5px solid var(--ink);border-radius:12px;color:var(--ink);padding:0 14px;font:800 20px var(--body);user-select:text;-webkit-user-select:text;touch-action:manipulation}
.ng-intro-card input:focus-visible{outline:3px solid var(--care);outline-offset:3px}
.ng-intro-card .ng-privacy{font:700 11px/1.85 var(--body);color:var(--muted);margin:18px 0 22px;word-break:keep-all}
.ng-intro-card .btn{width:100%;min-height:49px;height:auto;padding:12px 8px}
.ng-intro-card .btn:disabled{opacity:.5;cursor:default}
.ng-intro-card .ng-kicker{font:800 15px var(--body);margin:0 0 12px;word-break:break-all}
.ng-intro-card #ngGameTitle{font-size:clamp(46px,13vw,64px);margin:12px 0 10px}
.ng-intro-card .ng-sub{font:800 18px var(--body);margin:0 0 32px}
body.ng-intro .dock,body.ng-intro .top-buttons,body.ng-intro #bubble{visibility:hidden}
body.ng-intro.look-editing #lookModal{visibility:visible}
body .modes{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
body .dock .mode{font-size:clamp(13px,3.7vw,18px);height:41px;letter-spacing:0;padding:0 2px}
.mode.on[data-mode=feed]{background:#ffd23f;color:var(--ink);box-shadow:inset 0 -4px 0 #dab12b}
.mode.on[data-mode=wash]{background:#8fdcc9;color:var(--ink);box-shadow:inset 0 -4px 0 #62b9a6}
#ngItemHelp{height:33px;display:flex;align-items:center;justify-content:center;gap:5px;padding:2px 8px;border-radius:9px;background:#eef3ed;font:700 10.5px/1.4 var(--body);color:#4b587d;text-align:center;word-break:keep-all;overflow:hidden}
#ngItemHelp.changed{animation:ngHelpIn .18s ease-out}
body #ngItemHelp[hidden]{display:none!important}
body #hint{display:none!important}
#ngAuxPanel{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;min-height:80px;padding:12px;background:#fff7dd;border-radius:12px}
#ngAuxPanel[hidden]{display:none}
#ngAuxPanel .ng-action-icon{font-size:27px;line-height:1}
#ngAuxPanel p{margin:0;font:800 12px/1.6 var(--body);text-align:center;word-break:keep-all}
#ngAuxPanel .ng-creed-lead{display:block;font:600 10.5px/1.5 var(--body);font-style:normal;letter-spacing:.02em;color:#8a7a52}
#ngAuxPanel .ng-creed-tail{font:600 10.5px/1.5 var(--body);font-style:normal;letter-spacing:.02em;color:#8a7a52}
#ngAuxPanel .ng-creed-punch{font:900 13.5px/1.6 var(--body);letter-spacing:-.01em;color:#4a3a12;background:linear-gradient(transparent 62%,#ffe08a 62%,#ffd35c 92%,transparent 92%);padding:0 3px}
#ngAuxPanel .ng-creed-rule{display:block;width:38px;height:2px;margin:7px auto;border-radius:2px;background:linear-gradient(90deg,transparent,#e0b95a,transparent)}
#ngCleanProgress{height:7px;width:min(230px,80%);appearance:none;border:0;border-radius:9px;overflow:hidden;background:#dbe7e3}
#ngCleanProgress::-webkit-progress-bar{background:#dbe7e3}#ngCleanProgress::-webkit-progress-value{background:#3aa589;border-radius:9px}
.ng-scroll-frame{position:relative;min-width:0}
body .ng-scroll-frame[hidden]{display:none!important}
.ng-scroll-arrow{position:absolute;z-index:3;top:50%;transform:translateY(-50%);width:25px;height:35px;padding:0;border:2px solid var(--ink);border-radius:9px;background:#fff8c3ef;font:800 25px/1 var(--body);box-shadow:0 2px 0 #1f2a5c55}
.ng-scroll-arrow[data-dir="-1"]{left:-4px}.ng-scroll-arrow[data-dir="1"]{right:-4px}
.ng-scroll-arrow[hidden],body.tools-grid .ng-scroll-arrow{display:none!important}
body .tool-scroll.more-right{mask-image:none!important;-webkit-mask-image:none!important}

#ngStorageInfo{font-size:11px;color:var(--muted);line-height:1.65;margin:8px 0}
@keyframes ngHelpIn{from{opacity:.5;transform:translateY(2px)}to{opacity:1;transform:none}}
@media(max-width:430px){.look-title h2{font-size:20px}.look-header-actions{gap:5px}.look-header-actions #lookCancel{font-size:11.5px;padding:0 9px}.look-footer-actions #lookApply{font-size:17px;padding:0 12px}.look-history{gap:5px}.look-history button{width:36px;min-width:36px;padding:0 5px}}
@media(max-height:560px){#ngIntro{padding:12px}.ng-intro-card{padding:18px 22px}.ng-intro-card h1{font-size:31px;margin-bottom:16px}.ng-intro-card .ng-privacy{margin:12px 0}.ng-intro-card .ng-sub{margin-bottom:18px}#ngItemHelp{height:28px;font-size:10px}#ngAuxPanel{min-height:64px;padding:6px}}
@media(prefers-reduced-motion:reduce){#ngItemHelp.changed{animation:none}}

/* NG3: selectable food uses the same eight slots as the other tools. */
body #ngFeedTools[hidden]{display:none!important}
body #ngFeedTools:not([hidden]){display:flex!important;flex-wrap:nowrap!important;gap:4px!important;margin:0;padding:2px 0 4px!important;min-width:0;overflow-x:auto!important;overflow-y:hidden!important;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
body #ngFeedTools::-webkit-scrollbar{display:none}
body #ngFeedTools .tool{flex:1 0 64px!important;width:64px!important;min-width:64px!important;min-height:60px!important;margin:0!important;padding:3px 2px!important;font-size:11px!important;white-space:nowrap;scroll-snap-align:start;touch-action:pan-x!important}
body #ngFeedTools .ng-food-icon{display:flex;align-items:center;justify-content:center;width:34px;height:34px;font-size:29px;line-height:1}
body #ngFeedTools .tool.on{background:#fff0ab;box-shadow:inset 0 -3px 0 #d3b746}
body.tools-grid #ngFeedTools:not([hidden]){display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;overflow:visible!important;padding:2px 0!important}
body.tools-grid #ngFeedTools .tool{width:auto!important;min-width:0!important;min-height:56px!important;touch-action:manipulation!important}
body .dock .mode{white-space:nowrap;font-size:clamp(12px,3.35vw,17px)!important}
</style>
<style id="ng4-style">
/* NG4: small playback checkbox, full-text ticker, unchanged 4x2 tool grid. */
#ngAvoidLabel{position:absolute;left:53px;top:3px;display:flex;align-items:center;gap:6px;height:36px;margin:0;padding:0 9px 0 7px;pointer-events:auto;white-space:nowrap;font:800 11.5px/1.2 var(--body);letter-spacing:-.25px;color:var(--ink);border:2.5px solid #ff2e97;border-radius:11px;background:#fffdf4;box-shadow:0 3px 0 #c4156e;cursor:pointer}
#ngAvoidLabel:active{transform:translateY(2px);box-shadow:0 1px 0 #c4156e}
#ngAvoidLabel:has(input:checked){background:#ffe0ef}
#ngAvoidLabel input{width:15px;height:15px;min-width:15px;margin:0;accent-color:#ff2e97;cursor:pointer}
#ngAvoidLabel:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
/* 혐규오락실 얼굴 버튼: 바퀴벌레 게임과 같은 그림, 오른쪽 위 빈 귀퉁이 */
#arcadeFace{position:fixed;z-index:61;right:calc(6px + env(safe-area-inset-right,0px));top:calc(11px + env(safe-area-inset-top,0px));display:block;width:38px;height:38px;padding:6px;line-height:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

#arcadeFace:active svg{transform:scale(.88)}
#arcadeFace[hidden],body.look-editing #arcadeFace{display:none}
body.look-editing #ngAvoidLabel,body.ng-intro #ngAvoidLabel{visibility:hidden}
#ngItemHelp{justify-content:flex-start;gap:5px;text-align:left;min-width:0;flex-shrink:0}
#ngItemHelp .ng-help-icon{flex:none;align-self:center}
#ngItemHelp .ng-help-viewport{display:block;flex:1;min-width:0;overflow:hidden;white-space:nowrap;cursor:default;outline-offset:-1px}
#ngItemHelp .ng-help-text{display:inline-block;white-space:nowrap;max-width:none;padding:0;vertical-align:middle;will-change:transform}
#ngItemHelp .ng-help-item{display:inline-flex;align-items:center;gap:4px;margin-right:8px;padding:2px 8px 2px 3px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 1.5px #c6d6cd}
#ngItemHelp .ng-help-do{flex:none;padding:1px 7px;border-radius:99px;background:var(--ink);color:#fffdf4;font-weight:800}
#ngItemHelp .ng-help-arrow{flex:none;font-style:normal;color:#93a0ba}
#ngItemHelp .ng-help-res{color:var(--ink);font-weight:800}
#ngItemHelp .ng-help-note{display:inline-flex;align-items:center;gap:4px;margin-right:8px;padding:2px 8px;border-radius:99px;background:#e2ece5;color:#5d6b86;font-weight:700}
#ngItemHelp .ng-help-note::before{content:'i';display:inline-grid;place-items:center;width:11px;height:11px;border-radius:99px;background:#aebfc9;color:#fff;font:800 8px/1 var(--body)}
#ngItemHelp.scrolling .ng-help-viewport{cursor:pointer}
@media(prefers-reduced-motion:reduce){#ngItemHelp .ng-help-viewport{overflow-x:auto;scrollbar-width:none;touch-action:pan-x}#ngItemHelp .ng-help-text{will-change:auto}}
@media(max-width:345px){#ngAvoidLabel{left:50px;font-size:10px;gap:4px;padding:0 6px 0 5px}#ngAvoidLabel input{width:13px;height:13px;min-width:13px}}

</style>

<script>
// Display failures rather than leaving a blank canvas. No camera/microphone/motion permission is requested.
window.__bootGuard={lost:false,ready:false,failed:false};
window.showGameError=function(title,detail){const box=document.getElementById('fallback');box.style.display='flex';document.getElementById('fallbackTitle').textContent=title;document.getElementById('fallbackDetail').textContent=detail||'';document.getElementById('retryGame').hidden=false;};
document.getElementById('retryGame').onclick=()=>location.reload();
// 오락실 얼굴 버튼: 편집기·설정창이 떠 있으면 닫기 버튼과 겹치므로 숨긴다.
// 게임 중에 누르면 새 탭으로 열어서 하던 판이 날아가지 않게 한다. (바퀴벌레 게임과 같은 방식)
(function(){
  const face=document.getElementById('arcadeFace');if(!face)return;
  const sync=()=>{
    const intro=document.body.classList.contains('ng-intro')||!window.__bootGuard.ready;
    const covered=document.body.classList.contains('look-editing')||!!document.querySelector('.modal:not([hidden])');
    if(face.hidden!==covered)face.hidden=covered;
    const target=intro?'_top':'_blank';
    if(face.target!==target){face.target=target;if(intro)face.removeAttribute('rel');else face.rel='noopener';}
  };
  setInterval(sync,200);sync();
})();
addEventListener('unhandledrejection', e => {
  const guard = window.__bootGuard;
  if (!guard || guard.ready) return;

  guard.failed = true;

  const reason = e.reason;
  const message = reason && reason.message
    ? reason.message
    : String(reason || '초기화 오류');

  window.showGameError(
    '게임을 시작하는 중 오류가 났어요.',
    message.slice(0, 300)
  );
});
</script>

'use strict';
/* ================= 효과음: 전부 WebAudio로 합성 ================= */
const SFX = (() => {
  let ctx = null, master, bus, voiceBus, verb, verbSend, noise, on = true;

  const loops = {};
  const R = (a, b) => a + Math.random() * (b - a);

  function makeIR(sec, decay) {
    const len = Math.floor(ctx.sampleRate * sec), buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);

  function init() {

    if (!AC) return;

    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 6; comp.attack.value = 0.002; comp.release.value = 0.12;
    master = ctx.createGain(); master.gain.value = on ? 0.9 : 0;
    bus = ctx.createGain(); bus.gain.value = 1;

    limiter.attack.value=.001;limiter.release.value=.10;
    bus.connect(comp);comp.connect(limiter);limiter.connect(master);master.connect(ctx.destination);

    verb.connect(verbSend); verbSend.connect(comp);

    noise = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function unlock() { try { init(); if(ctx&&(ctx.state==='suspended'||ctx.state==='interrupted')){const p=ctx.resume();if(p&&p.catch)p.catch(()=>{});} } catch(e){console.warn('Audio unavailable:',e.message);} }

  // 출력: 패닝 + 리버브 센드
  function out(pan = 0, wet = 0.25, isVoice = false) {
    const g = ctx.createGain(),trim=ctx.createGain();
    trim.gain.value=effectTrim;g.connect(trim);
    let node = trim;
    if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); node.connect(p); node = p; }
    node.connect(isVoice ? voiceBus : bus);
    if (wet > 0) { const s = ctx.createGain(); s.gain.value = wet; node.connect(s); s.connect(verb); }
    return g;
  }
  function env(g, t, peak, a, d, curve = 'exp') {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    if (curve === 'exp') g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    else g.gain.linearRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(dest, t, { type = 'sine', f0 = 440, f1 = null, dur = 0.2, peak = 0.5, a = 0.002, glide = 'exp', detune = 0 }) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.detune.value = detune;
    o.frequency.setValueAtTime(f0, t);
    if (f1 != null) {
      if (glide === 'exp') o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
      else o.frequency.linearRampToValueAtTime(f1, t + dur);
    }
    env(g, t, peak, a, dur);
    o.connect(g); g.connect(dest);
    o.start(t); o.stop(t + a + dur + 0.05);
    return o;
  }
  function burst(dest, t, { dur = 0.1, peak = 0.5, a = 0.001, type = 'bandpass', f = 1000, f1 = null, q = 1, rate = 1 }) {

    s.buffer = noise; s.playbackRate.value = rate;
    fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
    if (f1 != null) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);

    const g = ctx.createGain();

      const ga = ctx.createGain(); ga.gain.value = amt * 3.2;

      const d = R(0.055, 0.085) * (mood > 0.7 ? 1.3 : 1);
      voice(t, { pitch: pitch * R(0.9, 1.15) * (1 + mood * 0.35), dur: d, peak: 0.16, bend: R(-0.1, 0.1) + (i === n - 1 ? (mood > 0.4 ? 0.25 : -0.15) : 0), pan, rough: mood > 0.7 ? 0.5 : 0.05 });

  };
  S.yelp = ({ pitch = 170, power = 1, pan = 0 } = {}) => {
    if (!ctx) return;
    const t = ctx.currentTime + 0.02;
    voice(t, { pitch: pitch * R(1.5, 1.9), dur: 0.12 + power * 0.1, peak: 0.24 + power * 0.08, vowel: [[730, 1090], [570, 840], [530, 1840]][(Math.random() * 3) | 0], bend: -0.35, pan, rough: 0.35 });
  };
  S.scream = ({ pitch = 170, pan = 0 } = {}) => {
    if (!ctx) return;
    const t = ctx.currentTime + 0.02;
    voice(t, { pitch: pitch * 1.6, dur: 0.18, peak: 0.26, vowel: [730, 1090], bend: 0.5, pan, rough: 0.4, wet: 0.3 });
    voice(t + 0.17, { pitch: pitch * 2.3, dur: 0.45, peak: 0.28, vowel: [730, 1090], bend: -0.45, pan, rough: 0.55, wet: 0.35 });
  };
  S.sob = ({ pitch = 170, pan = 0 } = {}) => {
    if (!ctx) return;
    let t = ctx.currentTime + 0.02;
    const n = 3 + ((Math.random() * 3) | 0);
    for (let i = 0; i < n; i++) {

  };

  S.whoosh = (pan = 0, big = false) => {
    if (!ctx) return;
    const t = ctx.currentTime, o = out(pan, 0.05);
    burst(o, t, { dur: big ? 0.32 : 0.16, peak: big ? 0.35 : 0.2, a: 0.04, type: 'bandpass', f: 350, f1: big ? 1400 : 2200, q: 1.3 });
  };
  S.punch = (power = 1, pan = 0) => {
    if (!ctx) return;
    const t = ctx.currentTime, o = out(pan, 0.18);
    const p = Math.min(1.8, power);
    tone(o, t, { f0: 170 * R(0.9, 1.1), f1: 42, dur: 0.24 + p * 0.06, peak: 0.95 });
    tone(o, t, { type: 'triangle', f0: 320, f1: 110, dur: 0.07, peak: 0.5 });
    tone(o, t, { f0: 62, f1: 38, dur: 0.35, peak: 0.55 * p, a: 0.004 });

  S.slap = (pan = 0, power = 1) => {
    if (!ctx) return;

    burst(o, t, { dur: 0.035, peak: 0.8, type: 'highpass', f: 4500 });

  S.hammer = (pan = 0, power = 1) => {

    tone(o,t+.004,{f0:(glance?1230:615)*pitch,f1:(glance?1150:585)*pitch,dur:.18,peak:.26});
    tone(o,t+.006,{f0:1475*pitch,dur:.125,peak:.15});
    tone(o,t+.011,{f0:2860*pitch,dur:.08,peak:.065});
    burst(o,t+.021,{dur:.055,peak:.1,type:'bandpass',f:740,q:3});
  };
  S.bat=(pan=0,power=1)=>{
    if(!ctx)return;const t=ctx.currentTime,o=out(pan,.16),p=Math.min(power,2.3);
    tone(o,t,{f0:145,f1:39,dur:.21,peak:.6+p*.15});
    tone(o,t,{type:'triangle',f0:430*R(.94,1.06),f1:190,dur:.080,peak:.53});
    burst(o,t,{dur:.031,peak:.85,type:'bandpass',f:1750,q:1.1});

  S.tissue = (pan = 0) => {
    if (!ctx) return;
    const t = ctx.currentTime, o = out(pan, 0.15);

    tone(o, t, { f0: 110, f1: 70, dur: 0.12, peak: 0.3 });

  };
  S.flick = (power = 1, pan = 0) => {
    if (!ctx) return;

  S.tooth = (pan = 0) => {

    if (!ctx) return;

    for (let i = 0; i < 6; i++) tone(o, t + R(0.02, 0.2), { f0: R(3500, 8000), dur: R(0.08, 0.2), peak: 0.12 });

const SC_CANVAS_BACKUPS = new WeakMap();

function canvasTex(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true });
  if (!g) throw new Error('텍스처용 캔버스를 만들지 못했습니다.');
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 4;

  let pixels = null, savedVersion = -1, sourceLost = false;
  const rec = {
    save() {
      if (sourceLost || g.isContextLost?.() || !c.width || !c.height) return;
      if (pixels && savedVersion === t.version &&
          pixels.width === c.width && pixels.height === c.height) return;
      try {
        pixels = g.getImageData(0, 0, c.width, c.height);
        savedVersion = t.version;
      } catch (error) {
        console.warn('텍스처 원본 백업 실패:', error);
      }
    },
    restore(force = false) {
      if (!pixels || sourceLost || g.isContextLost?.()) return false;
      if (pixels.width !== c.width || pixels.height !== c.height) return false;
      // Do not overwrite a legitimately redrawn texture with an older snapshot.
      if (!force && savedVersion !== t.version) return false;
      g.putImageData(pixels, 0, 0);
      t.needsUpdate = true;
      savedVersion = t.version;
      return true;
    }
  };
  SC_CANVAS_BACKUPS.set(t, rec);
  // Snapshot once on first upload, then refresh only when the page is left.
  t.onUpdate = () => { if (!pixels) rec.save(); };
  c.addEventListener('contextlost', () => { sourceLost = true; });
  c.addEventListener('contextrestored', () => {
    sourceLost = false;
    rec.restore(true);
    window.__SC_TEXTURE_RESUME?.request();
  });
  return { c, g, t };
}

  offsetAt(d, out) {

      const k = Math.exp(-(1 - d.dot(this.grabDir)) / 0.05);
      out.addScaledVector(this.grabOff, k);

  }

  addBump(d, amp, w = 0.03) {

  }

function removeParticle(i) {
  const p = particles[i]; if(!p)return;
  scene.remove(p.obj); particles.splice(i, 1);
  // Only standalone lens/temple fragments own their materials. A whole frame is a
  // clone sharing the avatar's resources; disposing it would break the worn pair.
  if(p.ownedFragment){p.obj.traverse(o=>{o.geometry?.dispose();if(o.material)for(const m of(Array.isArray(o.material)?o.material:[o.material]))m.dispose();});}
  const j=G.junk.indexOf(p.obj);if(j>=0)G.junk.splice(j,1);
}

/* 눈물·코피는 그 프레임의 자세가 다 정해진 뒤에 뿌린다.
   주워 먹느라 주저앉거나 맞아서 날아가는 동안에는 updateVillain 시점의 월드 행렬이
   아직 이전(서 있던) 자세라, 그때 바로 뿌리면 방울이 허공에서 생긴다. */
const LATE_FX = [];
function lateFX(v, at, make) { LATE_FX.push({ v, at, make }); }
function flushLateFX() {
  if (!LATE_FX.length) return;
  const v = G.v;
  if (v && v.root.parent) v.root.updateMatrixWorld(true);
  for (const q of LATE_FX) {
    if (!v || q.v !== v || !v.root.parent) continue;
    const p = q.at(v);
    if (p) q.make(p);
  }
  LATE_FX.length = 0;
}

function updateParticles(dt, game) {

  HEAVY_WET.update(dt, game);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age += dt;
    if (p.homing) {
      p.homing.t += dt / p.homing.dur;
      const t = Math.min(1, p.homing.t);
      const to = typeof p.homing.to === 'function' ? p.homing.to() : p.homing.to;
      p.obj.position.lerpVectors(p.homing.from, to, t * t * (3 - 2 * t));
      p.obj.position.y += Math.sin(t * Math.PI) * p.homing.arc;
      p.obj.rotation.y += dt * 8;
      if (t >= 1) { const cb = p.homing.done; removeParticle(i); cb && cb(); }
      continue;
    }
    if (!p.rest) {
      p.vel.y -= 9.8 * dt;
      p.obj.position.addScaledVector(p.vel, dt);
      p.obj.rotation.x += p.spin.x * dt; p.obj.rotation.y += p.spin.y * dt; p.obj.rotation.z += p.spin.z * dt;
      if (p.obj.position.z < -1.62 && p.vel.z < 0) { p.vel.z *= -0.4; p.obj.position.z = -1.62; if (p.kind === 'blood') { removeParticle(i); continue; } }
      if (p.obj.position.y < p.r) {
        if(p.groundVanish){if(p.sound)p.sound(Math.abs(p.vel.y));removeParticle(i);continue;}
        if (p.kind === 'blood' || p.kind === 'tear' || p.kind === 'sweat') {
          const x = p.obj.position.x, z = p.obj.position.z;
          if (p.kind === 'blood') { paintSplat(x, z, p.r * rnd(1.4, 2.6)); if (Math.random() < 0.25) SFX.drip(clamp(x, -1, 1)); }
          else paintSplat(x, z, p.r * 1.8, '#9fd8ff', 0.45);
          removeParticle(i); continue;
        }
        p.obj.position.y = p.r;
        const sp = Math.abs(p.vel.y);
        if (sp > 0.6 && p.sound) p.sound(sp);
        p.vel.y = sp * p.bounce; p.vel.x *= 0.62; p.vel.z *= 0.62; p.spin.multiplyScalar(0.5);
        if (sp < 0.45) { p.rest = true; p.vel.set(0, 0, 0); if (p.flat) { p.obj.rotation.x = p.flat.x; p.obj.rotation.z = p.flat.z; } }
      }
    }
    if (p.fade && p.age > p.life - 1) { p.obj.traverse(o => { if (o.material) { o.material.transparent = true; o.material.opacity = Math.max(0, p.life - p.age); } }); }
    if (p.age > p.life && !p.persist) { removeParticle(i); continue; }
  }
}

/* 말풍선 */
const bubble = $('#bubble');
const BUB = { text: '', until: 0, kind: '' };
function say(text, dur = 1.8, kind = '') {
  BUB.text = text; BUB.until = performance.now() + dur * 1000; BUB.kind = kind;
  bubble.textContent = text;
  bubble.className = 'bubble show' + (kind ? ' ' + kind : '');
}
function updateBubble(v) {
  if (!BUB.text) return;
  if (performance.now() > BUB.until) { bubble.classList.remove('show'); if (performance.now() > BUB.until + 200) BUB.text = ''; return; }
  // 머리의 화면상 중심과 반지름. 서 있든 누워 있든 '화면에서 머리 위'를 기준으로 삼는다.
  const centre = v.headMesh.getWorldPosition(V3());
  const edge = v.headMesh.localToWorld(V3(HEAD_R * v.look.headW, 0, 0));
  const [hx, cy] = toScreen(centre), [ex, ey] = toScreen(edge);
  const r = Math.hypot(ex - hx, ey - cy);
  const hy = cy - r * 1.08;
  const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
  // 말풍선은 머리 위에 둔다. 얼굴을 덮지 않는다.
  const btn = $('#settingsBtn').getBoundingClientRect();
  const minTop = 8;
  let left = hx + r * 0.2 - bw * 0.25, topPx = hy - bh - 14, beside = false;
  // 머리 위 자리가 모자라면 화면 위에 붙이기만 한다. 반대편으로 넘기지 않는다(가로는 계속 머리를 따라간다).
  if (topPx < minTop) topPx = minTop;
  left = clamp(left, 8, innerWidth - bw - 8);
  // 위쪽 띠(설정·회피형·오락실 얼굴)에 가리면 옆으로 비키고, 옆에도 자리가 없을 때만 띠 아래로 내린다.
  const bars = [btn, $('#ngAvoidLabel'), $('#arcadeFace')]
    .map(x => x instanceof Element ? x.getBoundingClientRect() : x)
    .filter(r => r && r.width > 0 && r.height > 0);
  const hits = (x, y) => bars.some(r => x < r.right + 6 && x + bw > r.left - 6 && y < r.bottom + 6 && y + bh > r.top - 6);
  if (hits(left, topPx)) {
    const lo = 8, hi = Math.max(8, innerWidth - bw - 8);
    let best = null;
    for (const r of bars) for (const x of [r.right + 8, r.left - 8 - bw]) {
      const c = clamp(x, lo, hi);
      if (!hits(c, topPx) && (best === null || Math.abs(c - left) < Math.abs(best - left))) best = c;
    }
    if (best !== null) left = best;
    else topPx = Math.max(topPx, Math.max(...bars.map(r => r.bottom)) + 6);
  }
  bubble.classList.toggle('side', beside);
  bubble.style.transform = `translate(${left}px,${topPx}px)`;
  bubble.style.setProperty('--tail', clamp(hx - left + 6, 16, bw - 30) + 'px');
}

/* ===== 누적 상처 / 대량 액체 이펙트 ===== */
function heavyWoundLevel(v) {
  const d = Math.max(0, (Number(v.damage) || 0) - 8);
  return d / (d + 55);
}

function heavyBruise(v, x, y, power) {
  let b = v.bruises.find(b => Math.hypot(b.x - x, b.y - y) < 55);
  if (!b) {
    b = { x, y, r: 42 + power * 16, lv: 0, heal: 1, fresh: [] };
    v.bruises.push(b);
    if (v.bruises.length > 40) v.bruises.shift();
  }
  b.lv += power * 0.4 / (1 + b.lv * 0.08);
  b.r = Math.min(155, b.r + 3 + power * 2);
  b.heal = 1;

  // 맞은 순간 무늬를 저장: 얼굴을 다시 그려도 자국이 떨리지 않는다.
  (b.fresh ||= []).push({
    x: x - b.x + rnd(-12, 12),
    y: y - b.y + rnd(-10, 10),
    angle: rnd(-1.5, 1.5),
    length: rnd(16, 32) + power * 9,
    seed: rnd(0, 100)
  });

  if (b.fresh.length > 5) b.fresh.shift();
  v.faceDirty = true;
}

function paintHeavyBruises(g, v) {
  for (const b of v.bruises) {
    const depth = b.lv / (b.lv + 3);
    const heal = clamp(b.heal, 0, 1);
    const c = [
      Math.round(220 - depth * 155),
      Math.round(78 - depth * 44),
      125
    ];
    const alpha = (0.30 + depth * 0.48) * heal;

    const gr = g.createRadialGradient(
      b.x, b.y, 0, b.x, b.y, b.r
    );
    gr.addColorStop(0, `rgba(${c},${alpha})`);
    gr.addColorStop(0.55, `rgba(${c},${alpha * 0.8})`);
    gr.addColorStop(1, `rgba(${c},0)`);

    g.fillStyle = gr;
    g.beginPath();
    g.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    g.fill();

    // 기존 멍 위에 새로운 붉은 흔적.
    // 반창고의 heal 값도 그대로 반영한다.
    for (const m of b.fresh || []) {
      g.save();
      g.translate(b.x + m.x, b.y + m.y);
      g.rotate(m.angle);
      g.globalAlpha = heal * (0.38 + depth * 0.42);
      g.lineCap = 'round';
      g.lineWidth = 3 + depth * 5;
      g.strokeStyle = '#e74859';

      for (let j = 0; j < 3; j++) {
        const y = (j - 1) * 9;
        g.beginPath();
        g.moveTo(-m.length * 0.5, y);
        g.quadraticCurveTo(
          0, y + Math.sin(m.seed + j) * 12,
          m.length * 0.5, y - 3
        );
        g.stroke();
      }

      g.fillStyle = '#bc263c';
      for (let j = 0; j < 5; j++) {
        g.beginPath();
        g.arc(
          Math.sin(m.seed + j * 7) * m.length,
          Math.cos(m.seed + j * 11) * 24,
          2 + depth * 3,
          0, Math.PI * 2
        );
        g.fill();
      }
      g.restore();
    }
  }
}

const HEAVY_WET = (() => {
  // 추가되는 대량 이펙트의 동시 방울 상한.
  // 기존 눈물·이빨·안경 등은 별도다.
  const MAX = 720;

  const material = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.14
  });
  material.userData.shared = true;

  const batch = new THREE.InstancedMesh(
    partGeo.drop, material, MAX
  );
  batch.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

  // 첫 렌더링 전부터 방울별 색상 데이터를 준비한다.
  batch.instanceColor = new THREE.InstancedBufferAttribute(
    new Float32Array(MAX * 3).fill(1),
    3
  );

  batch.instanceColor.setUsage(THREE.DynamicDrawUsage);
  material.needsUpdate = true;

  batch.frustumCulled = false;
  batch.castShadow = batch.receiveShadow = false;
  batch.count = 0;
  scene.add(batch);

  // 0: 피 / 1: 침 / 2: 콧물
  const colors = [
    col('#e41e3a'),
    col('#e3f4ff'),
    col('#c8df91')
  ];
  const floorColors = ['#dc2540', '#a8d9ed', '#c3d78b'];

  const pool = Array.from({ length: MAX }, () => ({
    p: V3(),
    v: V3(),
    size: 0,
    kind: 0,
    life: 0,
    stretch: 1
  }));

  const dummy = new THREE.Object3D();
  const up = V3(0, 1, 0);
  const direction = V3();

  let cursor = 0;
  let owner = null;
  let tail = null;
  let soundWait = 0;

  function clear(v) {
    for (const p of pool) p.life = 0;
    batch.count = 0;
    cursor = 0;
    tail = null;
    owner = v;
  }

  function ensure(v) {
    if (owner !== v) clear(v);
  }

  function emit(pos, vel, kind, size, stretch = 1) {
    const p = pool[cursor];
    cursor = (cursor + 1) % MAX;

    p.p.copy(pos);
    p.v.copy(vel);
    p.kind = kind;
    p.size = size;
    p.stretch = stretch;
    p.life = 2;
  }

  function mouth(v) {
    return v.mouthWorld().add(V3(0, -0.015, 0.025));
  }

  function nose(v) {
    return v.noseM.localToWorld(V3(0, -0.05, 0.03));
  }

  function burst(pos, count, kind, force, normal, level, power) {
    for (let i = 0; i < count; i++) {
      const vel = normal.clone()
        .multiplyScalar(rnd(0.5, 1.1))
        .addScaledVector(force, rnd(0.25, 0.65))
        .add(V3(
          rnd(-1.2, 1.2),
          rnd(0.4, 1.8),
          rnd(0.25, 1.05)
        ));

      vel.multiplyScalar(0.8 + power * 0.23);

      emit(
        pos,
        vel,
        kind,
        rnd(0.007, 0.014) * (1 + level * 0.9),
        kind === 2 ? rnd(1.8, 3.3) : rnd(1, 1.8)
      );
    }
  }

  function hit(v, h, power, onHead) {
    ensure(v);

    const level = heavyWoundLevel(v);
    const count = Math.round(
      (10 + level * 120) * (0.65 + power * 0.55)
    );

    const front = V3(0, 0, 1)
      .transformDirection(v.headMesh.matrixWorld);
    const at = h.point.clone()
      .addScaledVector(h.normal, 0.025);

    const wetBlood = Math.max(v.noseBlood, v.lipBlood);
    const bloodCount = v.damage > 6
      ? Math.round(
          count * (0.15 + level * 0.7)
          * (onHead ? 1 : wetBlood * 0.18)
        )
      : 0;

    burst(
      onHead ? at : mouth(v),
      bloodCount,
      0,
      h.force,
      onHead ? h.normal : front,
      level,
      power
    );

    burst(
      mouth(v),
      Math.round(count * (onHead ? 0.48 : 0.2)),
      1,
      h.force,
      front,
      level,
      power
    );

    burst(
      nose(v),
      Math.round(count * level * (onHead ? 0.32 : 0.08)),
      2,
      h.force,
      front,
      level,
      power
    );

    // 타격 직후 잠깐 더 쏟아지는 분출.
    // 연타해도 타이머를 무한히 쌓지는 않는다.
    if (onHead && level > 0.15) {
      tail = {
        left: 0.2 + level * 0.65,
        acc: 0,
        level,
        force: h.force.clone()
      };
    }
  }

  function drip(v, dt) {
    ensure(v);

    for (const [key, amount, from] of [
      ['_heavyNoseAcc', v.noseBlood, nose],

    ]) {
      if (amount <= 0.05) {
        v[key] = 0;
        continue;
      }

      v[key] = Math.min(
        4,
        (v[key] || 0) + dt * amount * (3 + level * 32)
      );

      while (v[key] >= 1) {
        v[key]--;

        const dripVel = V3(
          rnd(-0.08, 0.08),
          rnd(-0.5, -0.2),
          rnd(0.12, 0.3)
        );
        const dripSize = rnd(0.007, 0.012) * (1 + level * 0.6);
        lateFX(v, from, pos => emit(pos, dripVel, 0, dripSize, 1.25));
      }
    }
  }

  function update(dt, game) {
    ensure(game.v);
    const v = game.v;
    if (!v) return;

    dt = clamp(Number(dt) || 0, 0, 0.05);

    // 달래기로 전환하면 뒤따르는 분출은 중지한다.

            rnd(-0.45, 0.45),

            rnd(0.25, 0.7)

          }
        }

      }

      if (p.life <= 0 || p.p.z < -1.62) {

      }

      dummy.position.copy(p.p);
      direction.copy(p.v).normalize();

      if (direction.lengthSq() > 0) {
        dummy.quaternion.setFromUnitVectors(up, direction);
      } else {

      }

      dummy.scale.set(size, size * p.stretch, size);

    }

    batch.count = n;

    if (n) {
      batch.instanceMatrix.needsUpdate = true;
      if (batch.instanceColor) {
        batch.instanceColor.needsUpdate = true;
      }
    }
  }

  return { hit, drip, update, clear };
})();


const MARSHMALLOW = Object.freeze({
  recovery: 25,
  chewSeconds: 1.7
});

// 상처용 누적 데미지와 별개로,
// 쓰러짐 판정에 사용할 현재 피로도를 계산한다.
function marshmallowFatigue(v) {
  const cap =
    window.__SC_FATIGUE_V1?.config.collapseAt ?? 180;

  const raw = Math.max(0, Number(v.damage) || 0);

  const credit = Math.min(
    raw,
    Math.max(0, Number(v._marshmallowCredit) || 0)
  );

  // 약으로 데미지가 줄었을 때 회복값이 과하게 남지 않게 한다.
  v._marshmallowCredit = credit;

  return Math.min(cap, Math.max(0, raw - credit));
}

function feedMarshmallow(v) {
  const floor =
    window.__SC_FATIGUE_V1?.config.shakeAt ?? 55;

  const raw = Math.max(0, Number(v.damage) || 0);
  const before = marshmallowFatigue(v);

  // 55 아래로는 회복시키지 않는다.
  // 원래 55보다 낮았던 캐릭터의 데미지를 올리지도 않는다.
  const after = Math.min(
    before,
    Math.max(floor, before - MARSHMALLOW.recovery)
  );

  v._marshmallowCredit = raw - after;

  // 직전 피격 반응이 남아 있다면 그 뒤에도 씹는 시간이 남도록.
  v._marshmallowChew =
    MARSHMALLOW.chewSeconds + Math.max(0, v.ouch || 0);

  v.mouth.talk = 0;

  // 씹는 중에 중얼거림이 곧바로 끼어들지 않게 한다.
  v._mutterLeft = Math.max(
    v._mutterLeft || 0,
    v._marshmallowChew + 0.35
  );
}


function applyHit(h) {

    for (const i of order) { if (v.upper[i]) { arr = v.upper; idx = i; break; } }

function ensureActorCareHand(v, a) {
  if (a.careModels) return;

  a.baseHandChildren = a.hand.children.slice();
  a.careModels = {};

  for (const kind of ['open', 'thumb', 'flip']) {
    const m = buildCareHand(kind, v.skinMat, false);
    const size = kind === 'flip' ? 1.0 : .66;

    // 편 손은 엄지가 +X에,
    // 엄지척·가운데손가락 모델은 엄지가 -X에 만들어져 있다.
    const mirror = kind === 'open' ? -a.s : a.s;

    m.scale.set(size * mirror, size, size);

    a.hand.add(m);
    a.careModels[kind] = m;
  }
}





function actorCareHand(v,a,kind){

// Two-bone IK in torso-local coordinates. Both bones retain their original lengths.
function poseCareArm(v,a,target,palmNormal,weight,kind='open'){
  if(weight<=.001)return;
  const shoulder=a.sh.position.clone(),d=target.clone().sub(shoulder),len=clamp(d.length(),.035,.396);d.normalize();
  const pole=V3(a.s*.8,-.22,-.45).projectOnPlane(d).normalize();
  const elbow=shoulder.clone().addScaledVector(d,len*.5).addScaledVector(pole,Math.sqrt(Math.max(0,.04-len*len*.25)));
  const hand=shoulder.clone().addScaledVector(d,len);
  const qs=new THREE.Quaternion().setFromUnitVectors(V3(0,-1,0),elbow.clone().sub(shoulder).normalize());
  const localForearm=hand.clone().sub(elbow).normalize().applyQuaternion(qs.clone().invert());
  const qe=new THREE.Quaternion().setFromUnitVectors(V3(0,-1,0),localForearm);
  a.sh.quaternion.slerp(qs,weight);a.el.quaternion.slerp(qe,weight);
  v.root.updateMatrixWorld(true);
  const facing=new THREE.Object3D();orient(facing,palmNormal,V3(0,1,0));
  const worldQ=v.torso.getWorldQuaternion(new THREE.Quaternion()).multiply(facing.quaternion);
  const handQ=a.el.getWorldQuaternion(new THREE.Quaternion()).invert().multiply(worldQ);
  a.hand.quaternion.slerp(handQ,weight);if(weight>.12)actorCareHand(v,a,kind);

// 하이파이브 손 위치: 몸 비율과 상관없이 머리 바깥, 팔이 닿는 곳을 매 프레임 계산한다.

  const rx=r(1,0,0)*1.15+.10,ry=r(0,1,0)*1.10+.14,rz=r(0,0,1)*1.15+.08;

    p=V3(k>0?Math.min(-.425,c.x-rx*Math.sqrt(k)):-.425,y,z);
    if(p.distanceTo(sh)<=.38)return p;
  }

}

// 두 선분 사이의 최단 거리
function segmentGap(p1, q1, p2, q2) {
  const d1 = q1.clone().sub(p1), d2 = q2.clone().sub(p2), r = p1.clone().sub(p2);
  const a = d1.dot(d1), e = d2.dot(d2), f = d2.dot(r);
  let s = 0, t = 0;
  if (a > 1e-9 && e > 1e-9) {
    const b = d1.dot(d2), c = d1.dot(r), den = a * e - b * b;
    s = den > 1e-9 ? clamp((b * f - c * e) / den, 0, 1) : 0;
    t = (b * s + f) / e;
    if (t < 0) { t = 0; s = clamp(-c / a, 0, 1); }
    else if (t > 1) { t = 1; s = clamp((b - c) / a, 0, 1); }
  } else if (a > 1e-9) s = clamp(-d1.dot(r) / a, 0, 1);
  else if (e > 1e-9) t = clamp(f / e, 0, 1);
  return p1.clone().addScaledVector(d1, s).distanceTo(p2.clone().addScaledVector(d2, t));
}






// 줄넘기에 걸린 동안의 팔꿈치 방향. 몸통이 넓어 어깨·팔꿈치가 바깥으로 나가도 줄이 팔을 뚫지 않게 한다.
// 자연스러운 방향(아래·바깥)에서 가까운 각도부터 훑어, 줄의 직선 구간과 팔 굵기만큼 떨어지는 첫 각도를 쓴다.
function ropeSafePole(v, a, origin, axis, distance, L, target) {
  const free = v.state === 'tether' ? v._ropeFree : null;
  if (!free) { a._ropeAngle = undefined; return null; }
  const bend = Math.sqrt(Math.max(0, L * L - distance * distance / 4));
  const prefer = V3(a.s * .75, -.65, -.10).projectOnPlane(axis);
  if (bend < .004 || prefer.lengthSq() < 1e-8) return null;
  prefer.normalize();
  const side = V3().crossVectors(axis, prefer).normalize();
  const T = v.torso, need = .066 * Math.max(.3, v.look.bodyW) + .026;
  const shoulder = T.localToWorld(origin.clone()), hand = T.localToWorld(target.clone());
  const mid = origin.clone().addScaledVector(axis, distance / 2);
  const gapAt = angle => {
    const elbow = T.localToWorld(mid.clone().addScaledVector(prefer, Math.cos(angle) * bend).addScaledVector(side, Math.sin(angle) * bend));
    // 손은 줄을 쥐는 자리라 제외하고, 팔꿈치 쪽 70%만 본다.
    const wrist = elbow.clone().lerp(hand, .7);
    let gap = 1e9;
    for (const [p, q] of free) gap = Math.min(gap, segmentGap(shoulder, elbow, p, q), segmentGap(elbow, wrist, p, q));
    return gap;
  };
  let chosen = 0, bestGap = -1;
  for (let i = 0; i < 17; i++) {
    const angle = (i % 2 ? 1 : -1) * Math.ceil(i / 2) * Math.PI / 12, gap = gapAt(angle);   // 0, ±15°, ±30° … ±120°
    if (gap >= need) { chosen = angle; bestGap = gap; break; }
    if (gap > bestGap) { bestGap = gap; chosen = angle; }
  }
  // 당기는 세기가 바뀔 때 팔꿈치가 튀지 않게 천천히 따라간다.
  a._ropeAngle = a._ropeAngle === undefined ? chosen : a._ropeAngle + (chosen - a._ropeAngle) * .3;
  return prefer.multiplyScalar(Math.cos(a._ropeAngle)).addScaledVector(side, Math.sin(a._ropeAngle));
}

    v._guardV2 || v._wipeV2 ||

    v.state !== 'tether' &&

  const oldOffset = Villain.prototype.offsetAt;

  Villain.prototype.offsetAt = function(d, out) {
    oldOffset.call(this, d, out);

    if (!this._slapDents?.length) return out;

    // 손으로 볼을 잡아당기는 변형은 자동 데미지 제한에서 분리한다.
    const grabWeight = this.grabOff.lengthSq() > 1e-7
      ? Math.exp(-(1 - d.dot(this.grabDir)) / 0.05)
      : 0;

    if (grabWeight) {

    const hollow = clamp(-residual.dot(d) / 0.025, 0, 1);

    if (hollow > 0) {
      let swelling = 0;

      for (const b of this.bumps || []) {
        const k = Math.exp(-(1 - d.dot(b.d)) / b.w);

      const available = Math.max(0, out.dot(d));

      out.addScaledVector(
        d,
        -Math.min(available, swelling) * hollow

    }

    // 순간 변형과 누적 찌그러짐을 합친 결과에 제한을 적용한다.
    out.add(residual).clampLength(0, CFG.maxFaceOffset);

    // 직접 잡아당기는 동작은 마지막에 그대로 더한다.
    if (grabWeight) {

    // 거리는 건드리지 않고 시선 높이만 지금 실제 머리 끝에 맞춘다. 크기와 좌우 너비는 그대로다.

function updateHomerun(v, m, dt) {
  if (m.phase === 'fly') {
    tumblePose(v, m);

    m.pivot.addScaledVector(m.vel, dt);
    m.vel.y -= 6 * dt;
    m.angle += m.spin * dt;

    pin(v, m);

    // 완전히 화면 밖에 도달한 순간.
    if (m.side * m.pivot.x >= m.side * m.offX) {
      m.phase = 'wait';
      m.age = 0;
      v.root.visible = false;

      event('offscreen');

      // 날아간 방향에서 한 번만 재생.
      SFX.batOffscreenCrash?.(m.side * .90);
    }

  } else if (m.phase === 'wait') {
    v.root.visible = false;

    // 우당탕 소리가 난 뒤에 돌아오도록,
    // 기존 .48초보다 화면 밖 대기 시간을 늘린다.
    if (m.age > 1.08) {
      neutralBody(v);
      v.root.visible = true;

      m.kind = 'limp';
      m.age = 0;
      m.returnX = m.offX;
      m.returnZ = 0;

      m.duration = Math.max(
        1.6,
        Math.abs(m.offX) / CFG.returnSpeed
      );

      event('limp-start');
    }
  }
}

  function reachHand(v,a,worldTarget,weight=1){

    if(rec?.fore){rec.fore.position.y=-.085*stretch;rec.fore.scale.y=stretch;}

(() => {
  if(window.__SC_ROPE_AUDIO_V1)return;
  const CFG=Object.freeze({voiceAt:.67,pullEvery:.19,voiceEvery:.95});
  let current=null,owner=null,prevDistance=0,lastPull=-10,nextVoice=0,previousTension=0;
  function stop(){
    SFX.ropeAudioStop();current=owner=null;prevDistance=previousTension=0;
    lastPull=-10;nextVoice=0;
  }
  const oldHold=updateToolHold;
  updateToolHold=function(dt){
    const out=oldHold.apply(this,arguments),P=G.ptr,H=P?.toolHold,v=G.v;
    if(G.editing||document.hidden||G.mode!=='hit'||G.tool!=='rope'||
      !P||P.kind!=='ropeHold'||!H||!v||v.state!=='tether'||!PREF.sound){
      if(current)stop();return out;
    }
    if(H!==current||v!==owner){
      stop();current=H;owner=v;nextVoice=G.time+.20;
    }
    const q=clamp(Number.isFinite(H.tension)?H.tension:0,0,1);
    const distance=Math.hypot(P.last.x-P.x0,P.last.y-P.y0);
    const movingOut=distance-prevDistance>.35;
    const loading=q-previousTension>.007;
    const pan=clamp((H.pullX||0)*2,-.65,.65);
    const falling=previousTension-q>.006;
    // 줄이 목에 처음 걸리는 순간: 뜨득 한 번.
    if(!H.creakGrab){H.creakGrab=true;const len=SFX.ropeCreak(pan,.5,'hold');if(len)H.holdCreakAt=G.time+len+.5;}
    if(q>.5&&(movingOut||loading)){
      // 당기는 중: 까가각. 앞 소리가 끝난 뒤에 다음 소리를 낸다.
      if(G.time>=(H.creakAt||0)){
        const len=SFX.ropeCreak(pan,q,'pull');
        if(len){H.creakAt=G.time+len+rnd(.05,.14);H.holdCreakAt=G.time+len+rnd(.25,.5);lastPull=G.time;}
      }
    }else if(falling){
      if(G.time>=(H.releaseAt||0)){SFX.ropeCreak(pan,q,'release');H.releaseAt=G.time+.32;}
    }else if(q>.58&&G.time>=(H.holdCreakAt||0)&&G.time>=(H.creakAt||0)){
      // 손을 멈추고 팽팽하게 버티는 중: 뜨득… 뜨득. 세게 당길수록 자주.

    if(q>=CFG.voiceAt&&G.time>=nextVoice){
      SFX.ropeGrunt(pan,q,v.look.pitch);
      nextVoice=G.time+CFG.voiceEvery+rnd(-.12,.20);
    }else if(q<CFG.voiceAt){
      nextVoice=Math.max(nextVoice,G.time+.10);

    prevDistance=distance;previousTension=q;return out;
  };

    '괜찮다고 말해 줘': '좀 닥치고 있어도 괜찮아',
    '버림받을까 봐 무서워': '주운 적도 없어 이 새끼야',
    '다들 떠날 것 같아': '온 적도 없어 이 새끼야',
    '내일이 무서워': '잠이나 처 자',
    '나는 사랑 받을 자격이 없는 거 같아': '맞아'
  };

  const SHOW_MS = 1700;  // 말풍선 최소 표시 시간(긴 말은 글자 수만큼 더 오래)
  const GAP_MS = 250;    // 말풍선이 사라진 뒤 다음 말까지 쉬는 시간
  const PAIR_SEC = 4;    // 독백이 뜬 뒤 이 시간 안에 때려야 받아친다

  const dock = document.querySelector('.dock');
  if (!dock) return;

  const el = document.createElement('div');
  el.className = 'player-bubble';
  el.hidden = true;
  el.setAttribute('role', 'status');
  el.setAttribute('aria-live', 'polite');
  el.setAttribute('aria-atomic', 'true');
  el.innerHTML = '<span></span>';
  dock.append(el);

  const text = el.querySelector('span');
  let timer = 0;
  let nextAt = -Infinity;
  let lastLine = '';

  function hide() {
    clearTimeout(timer);
    timer = 0;
    el.hidden = true;
  }

  function reset() {
    hide();
    nextAt = -Infinity;
    lastLine = '';
  }

  const pickFrom = list => chooseDialogue(list,'player');

  function say() {
    // 달래기·외모 편집·설정창에서는 욕하지 않는다.
    if (
      G.mode !== 'hit' ||
      G.editing ||
      !G.v ||
      document.hidden ||
      document.querySelector('.modal:not([hidden])')
    ) return;

    const now = performance.now();
    const whine = G.lastWhine;
    const paired = !!(whine && !whine.used && G.time - whine.t < PAIR_SEC && RETORTS[whine.text]);
    if (now < nextAt && !paired) return;
    let line = '';
    if (whine && !whine.used && G.time - whine.t < PAIR_SEC && RETORTS[whine.text]) {
      line=RETORTS[whine.text];
      whine.used = true;
    }
    if (!line) line = pickFrom(LINES) || '야.';

    // 긴 말은 읽을 시간을 더 주고, 글자를 조금 줄여 두 줄 안에 넣는다.
    const ms = Math.min(4200, Math.max(SHOW_MS, 900 + line.length * 85));
    clearTimeout(timer);
    nextAt = now + ms + GAP_MS;
    lastLine = line;rememberDialogue('player',line);
    text.textContent = line;
    el.classList.toggle('long', line.length > 16);
    el.hidden = false;
    window.__SC_ROOM_UI_V1?.hideHelp();  // 같은 띠를 쓰는 안내문은 내 말이 뜨면 비킨다.
    timer = setTimeout(hide, ms);
  }

  // 실제 타격이 기록된 경우만 연결. 허공 스윙에는 말하지 않는다.
  const oldHit = applyHit;
  applyHit = function(h) {
    const v = G.v;
    const before = v?.st?.hits || 0;
    const result = oldHit.apply(this, arguments);

    if (
      v &&
      G.v === v &&
      v.st.hits > before &&
      h?.tool !== 'tissue'
    ) say();

    return result;
  };

  // 줄넘기는 타격 대신 잡기가 시작되는 순간에 한 번.
  const oldHold = startToolHold;
  startToolHold = function(P, e) {
    const before = P?.toolHold;
    const result = oldHold.apply(this, arguments);

    if (
      P?.kind === 'ropeHold' &&
      P.toolHold &&
      P.toolHold !== before
    ) say();

    return result;
  };

  // 모드 변경·설정·외모 편집 등을 누르면 바로 숨긴다.
  document.addEventListener('click', e => {
    if (
      e.target instanceof Element &&
      e.target.closest('[data-mode], .top button')
    ) reset();
  }, true);

  addEventListener('blur', reset);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) reset();
  });

  window.__SC_PLAYER_BUBBLE_V1 = { say, hide, reset, lines: [...LINES, ...Object.values(RETORTS)] };

  if (window.__api) {
    Object.assign(window.__api, {
      applyHit,
      startToolHold
    });
  }
})();

    '지금은 조금 쉬어도 괜찮아.': ['stop', '그래 그렇게 평생 쉬어라']
  };


  const choices = {
    comfort: ['inspect', 'shrug', 'stop', 'flip'],
    hand: ['stop', 'brush', 'flip'],
    love: ['inspect', 'brush', 'stop', 'flip'],
    thumb: ['inspect', 'shrug', 'flip'],
    clap: ['stop', 'brush', 'inspect', 'flip'],
    fiveMiss: ['stop', 'brush', 'flip'],
    hug: ['stop', 'brush'],
    release: ['brush', 'inspect', 'flip']
  };

  // 감사/수줍음 분기는 사용하지 않는다.
  // 같은 동작이 연속으로 나오는 것도 피한다.
  queueCareReply = function(group) {
    const v = G.v;

    if (
      !v || G.mode !== 'care' || G.editing ||
      !['stand', 'hug'].includes(v.state)
    ) return;

    if (group === 'fiveHit') group = 'fiveMiss';

    const pool = choices[G.hug ? 'hug' : group] || choices.comfort;
    // 방금 내가 건넨 말에 짝지은 대꾸가 있으면 그걸 먼저 쓴다.
    const said = G.lastCareLine && G.time - G.lastCareLine.t < 8 ? G.lastCareLine.text : '';
    const paired = retorts[said];
    let gesture,line;
    // 이어치기 대꾸도 최근 5개 안에 한 말이면 일반 대꾸로 돌린다.
    if(paired&&!RECENT_DIALOGUE.character.includes(paired[1])){
      gesture=pool.includes(paired[0])?paired[0]:pick(pool);line=paired[1];
    }else{
      const options=pool.flatMap(gesture=>replies[gesture].map(line=>({gesture,line})));
      const allowed=dialogueCandidates(options.map(x=>x.line),'character');
      const fresh=options.filter(x=>allowed.includes(x.line)),other=fresh.filter(x=>x.gesture!==v._snubLast);
      const choice=pick(other.length?other:fresh);gesture=choice.gesture;line=choice.line;
    }

    v._snubLast = gesture;
    v._snubLine = line;

    G.react = {
      v,
      group,
      gesture,
      line,
      flip: gesture === 'flip',
      fired: false,
      t: 0,
      delay: careReplyDelay(group)
    };

    if (G.social) G.social.noEcho = true;
  };

  careReplyLine = r => r.line || '똥싸고 있네 븅신';

  updateCareReply = function(dt) {
    const r = G.react;
    if (!r) return;

    if (
      r.v !== G.v || G.mode !== 'care' || G.editing ||
      !['stand', 'hug'].includes(r.v.state)
    ) {
      G.react = null;
      return;
    }

    const a = G.social;

    // Continue the reply clock during clapping; repeated claps never reset it.

    r.t += dt;
    // A local spoken player line finishes first; otherwise leave a short beat after the caption appears.
    if(!r.fired&&CareVoice.isSpeaking())r.delay=Math.max(r.delay,r.t+.18);

    if (!r.fired && r.t >= r.delay) {
      r.fired = true;
      const line = careReplyLine(r);

      // 짧은 대사는 2초, 긴 대사는 글자 수에 맞춰 더 오래 표시.
      const duration = clamp(

        2,
        4.2
      );

    ) {

  };

  poseSocialActor = function(v, dt) {
    restoreCareActorHands(v);
    if (!careIsAwkward(v)) return;

    const r = G.react;
    if (!r || r.v !== v || !r.fired) return;

    if (r.gesture === 'flip') {
      poseCareFlip(v);
      return;
    }

    const t = r.t - r.delay;
    const w = careWindow(t, 0, .25, 1.65, 2.2);
    if (w <= .001) return;

    const right = v.armRig[1];

    if (r.gesture === 'stop') {
      // 손바닥을 내보이며 "됐어".
      // 얼굴 아래에서 한 번만 밀어낸다.
      const p = flipHandTarget(v);
      p.y = Math.min(p.y, .36);

      poseCareArm(v, right, p, V3(0, 0, 1), w);

    } else if (r.gesture === 'shrug') {
      // 양쪽 손바닥을 위로.
      // 박수처럼 두 손을 모으지 않는다.
      const lift = carePulse(t, .20, .9);

      for (const arm of v.armRig) {
        const p = V3(
          arm.s * (.38 + .025 * lift),
          .23 + .04 * lift,
          .21
        );

        poseCareArm(v, arm, p, V3(0, 1, .25), w);
      }

    } else if (r.gesture === 'brush') {
      // 한 번 옆으로 쓸어 치우기.
      // 인사처럼 계속 흔들지 않는다.
      const sweep = ease(clamp((t - .28) / .55, 0, 1));

      const p = V3(
        .29 + .15 * sweep,
        .26,
        .27 - .07 * sweep
      );

      poseCareArm(v, right, p, V3(-.28, .06, 1), w);
    }

    // inspect는 손을 쓰지 않고 시선·턱으로만 반응한다.
  };

  careFace = function(v) {
    const f = {
      x: -.055,
      y: .045,
      z: 0,
      px: .008,
      py: 0,
      open: .76,
      brow: .025,
      mouth: .018
    };

    const r = G.react;

    if (r?.v === v && r.fired) {

          ease(clamp(t / .85, 0, 1))

        f.y += .62 * careWindow(t, .9, 1.2, 1.65, 2.2);

      } else if (r.gesture === 'shrug') {

        f.brow = .055;

      } else if (r.gesture === 'brush') {
        f.y += .55 * w;
        f.px = .020 * w;

      } else {
        f.x -= .07 * w;
        f.y -= .23 * w;
      }
    }

    // 놀라서 두 번 깜빡이는 동작은 제거.
    // 기존 자연 눈깜빡임은 그대로 남는다.
    return f;
  };

  const oldStart = startSocial;

  startSocial = function(kind) {
    const result = oldStart.apply(this, arguments);

  requestHighFive = () => false;

  const oldSocial = updateSocial;

  updateSocial = function(dt) {
    if (G.social) G.social.noEcho = true;

    const result = oldSocial.apply(this, arguments);
    const a = G.social;

  const oldRender = renderSocialHands;

    if (a?.kind !== 'five' || a.phase !== 'snub') {

    Object.values(RIG.care).forEach(h => h.visible = false);
    RIG.open.forEach(h => h.visible = false);

    // 나는 손을 내밀었다가, 거절당하고 혼자 내린다.
    const hand = RIG.open[0];
    const w = careWindow(a.t, 0, .30, 1.35, 2.15);

    const target = v.headMesh
      .getWorldPosition(V3())
      .add(V3(-.48, -.27, .70));

    hand.visible = w > .001;
    hand.position.copy(camRest(-1, -.85)).lerp(target, w);
    orient(hand, V3(0, 0, -1), V3(0, 1, 0));

    
    return true;
  };

  HINTS.five = '손을 내밀어 하이파이브 청하기';

  window.__SC_CARE_SNUB_V1 = { version: 1 };

  if (window.__api) {
    Object.assign(window.__api, {
      queueCareReply,
      careReplyLine,
      updateCareReply,
      poseSocialActor,
      careFace,
      startSocial,
      requestHighFive,
      updateSocial,
      renderSocialHands
    });
  }
})();

  let timer = 0;

  const oldHint = setHint;

  setHint = function() {

    if (key() !== selected) {
      if (showHelp()) { selected = key(); seen.add(selected); }

 * 기존 ROOM_UI_V1 뒤, '시작' 주석 바로 위에 한 번만 추가.

(() => {
  'use strict';
  if (window.__SC_CARE8_MEDICINE_V1) return;

  const medicine = document.querySelector('[data-care="bandage"]');
  const talk = document.querySelector('#careTalk');

  }, true);

  let treatment = null;

  const cream = new THREE.Mesh(
    new THREE.SphereGeometry(.037, 14, 10),
    new THREE.MeshStandardMaterial({
      color: '#d5f5df',

    })
  );

  cream.name = 'medicine-cream';
  cream.visible = false;

  const progress = $('#medicineProgress');

  function showProgress() {
    const n = G.v ? (courses.get(G.v) || 0) : 0;
    progress.hidden = n === 0;
    progress.textContent = `${n}/${DOSES}`;
  }

  function cancelTreatment() {
    if (!treatment) return;

    treatment = null;
    cream.visible = false;
    RIG.open[1].visible = false;
    medicine.removeAttribute('aria-busy');
  }

  function wounded(v) {
    return v.damage > .001 || v.glassLv > 0 || v.glassOff ||
      v.noseBlood > .01 || v.lipBlood > .01 || v._crownV2 > .001 ||
      v.bruises?.length || v.bumps?.length || v.lumps?.length ||
      v.marks?.length || v._slapDents?.length ||
      v._bodyCloth?.dents?.length ||
      v.upper?.some(x => !x) || v.lower?.some(x => !x);
  }

  function partialHeal(v, count) {
    const f = (DOSES - count) / (DOSES - count + 1);

    for (const k of [
      'damage', 'fear', 'noseBlood', 'lipBlood',
      'tear', 'wet', 'noseRed', '_crownV2'
    ]) {
      if (Number.isFinite(v[k])) v[k] *= f;
    }

    for (const b of v.bruises || []) b.heal = (b.heal ?? 1) * f;
    for (const b of v.bumps || []) b.amp *= f;
    for (const m of v.marks || []) m.a *= f;
    for (const l of v.lumps || []) l.userData.target *= f;
    for (const e of v.eyes || []) e.swell *= f;
    for (const d of v._slapDents || []) d.depth *= f;

    const c = v._bodyCloth;

    if (c) {
      for (const d of c.dents) {
        d.depth *= f;
        d.kick *= f;
      }
      c.dirty = true;
    }

    v.tearClear = 3;
    v.faceDirty = true;
    v.headDirty = true;
  }

  function fullHeal(v) {
    // 같은 이름·외모·죄목으로 손상 없는 모델을 만든다.
    // newVillain()을 호출하지 않으므로 입장 연출·인원 집계는 발생하지 않는다.

    const fresh = new Villain(
      { ...v.look },

  }

  const oldCareAct = careAct;

  careAct = function(kind, info, e) {

  };

  // 이전 코드가 직접 호출해도 반창고 대신 약 바르기로 연결.

  const oldHands = updateCareHands;

    const a = treatment;

      G.v !== a.v || G.mode !== 'care' ||
      G.care !== 'bandage' || G.editing ||
      a.v.state !== 'stand' || document.hidden ||

    const p = liveContactPoint(a.info);
    const n = hitNormal(a.info).normalize();
    const u = V3(0, 1, 0).cross(n);

    const w = n.clone().cross(u).normalize();

    const into = ease(clamp(a.t / .20, 0, 1));
    const out = ease(clamp((a.t - .66) / .20, 0, 1));
    const rub = Math.sin(
      clamp((a.t - .20) / .46, 0, 1) * Math.PI
    );

    const target = p.clone()
      .addScaledVector(n, .065)
      .addScaledVector(u, Math.sin(a.t * 23) * .022 * rub)
      .addScaledVector(w, Math.cos(a.t * 23) * .016 * rub);

    const h = RIG.open[1];
    h.visible = true;

    h.position.copy(camRest(1, -.9))
      .lerp(target, into)
      .lerp(camRest(1, -.9), out);

    orient(h, n.clone().negate(), w);
    keepHandOffNose(h, a.v, n);   // 코가 손바닥을 뚫고 나오지 않게

    cream.visible = a.t > .20 && a.t < .78;
    cream.position.copy(p).addScaledVector(n, .012);
    orient(cream, n, w);

    cream.scale.set(1 + rub * .6, .6, .14);
    cream.material.opacity = .86 * (1 - out);

    if (!a.contact && a.t >= .23) {
      a.contact = true;
      SFX.pat(clamp(p.x, -1, 1));
    }

    if (a.t < .86) return;

    // 동작을 끝낸 경우만 인정. 연타·중도 취소로 횟수가 늘어나지 않는다.
    const v = a.v;
    const count = Math.min(
      DOSES,
      (courses.get(v) || 0) + 1
    );

    cancelTreatment();
    courses.set(v, count);

    if (count < DOSES) {
      partialHeal(v, count);
      popText(`회복 ${count}/${DOSES}`, p, 'pat', 28);
    } else {
      const healed = fullHeal(v);
      popText(
        '회복 완료!',
        healed.headMesh.getWorldPosition(V3()),
        'pat',
        34
      );
    }

    showProgress();
  };

  const oldStop = stopSocial;

  stopSocial = function() {
    cancelTreatment();
    return oldStop.apply(this, arguments);
  };

  const oldHit = applyHit;

  applyHit = function(h) {
    const v = G.v;
    const before = v?.st?.hits;

    cancelTreatment();
    const result = oldHit.apply(this, arguments);

    if (

    }

    return result;
  };

  const oldButtons = updateCareButtons;

  updateCareButtons = function() {
    const result = oldButtons.apply(this, arguments);
    showProgress();
    return result;
  };

  addEventListener('blur', cancelTreatment);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelTreatment();
  });

  canvas.addEventListener('webglcontextlost', cancelTreatment);

  document.addEventListener('click', e => {
    if (e.target.closest?.(
      '[data-care], [data-mode], .top button'
    )) {
      cancelTreatment();
    }
  }, true);

  window.__SC_CARE8_MEDICINE_V1 = {
    version: 1,
    doses: DOSES,
    inspect: () => ({
      active: !!treatment,
      doses: G.v ? courses.get(G.v) || 0 : 0
    }),
    cancel: cancelTreatment
  };

  if (window.__api) {
    Object.assign(window.__api, {
      careAct,
      updateCareHands,
      stopSocial,
      applyHit,
      updateCareButtons
    });
  }
})();

      const p=r.shoeP,dy=p.y-knee,c=Math.cos(angle),s=Math.sin(angle);
      r.shoe.position.set(p.x,knee+dy*c-p.z*s,dy*s+p.z*c);
      r.shoe.quaternion.setFromAxisAngle(new THREE.Vector3(1,0,0),angle)
        .multiply(r.shoeQ);
    }
  }

  function armLengths(v,a,L) {
    const stretch=L/0.2,rec=v._bodyCloth?.arms.find(r=>r.a===a);
    a.el.position.y=-L;a.hand.position.y=-L;
    if(rec?.upper){rec.upper.position.y=-0.10*stretch;rec.upper.scale.y=stretch;}
    if(rec?.fore){rec.fore.position.y=-0.085*stretch;rec.fore.scale.y=stretch;}
    if(rec?.cuff)rec.cuff.position.y=-0.17*stretch;
  }
  // 두 손으로 얼굴을 가린다. 몸이 가늘고 머리가 큰 외모 조합에서도 손이 얼굴 앞에 닿는다.
  function coverFace(v,a,weight) {
    if(weight<0.001)return;
    v.root.updateMatrixWorld(true);
    const d=new THREE.Vector3(a.s*0.30,0.05,0.95).normalize();
    const p=v.surfacePoint(d).addScaledVector(d,.085);   // 표면에서 실제 거리만큼 띄운다(좁은 얼굴에서도 손이 볼에 묻히지 않게)
    const world=v.headMesh.localToWorld(p.clone());
    const target=v.torso.worldToLocal(world);
    const origin=a.sh.position.clone(),delta=target.clone().sub(origin);
    const distance=delta.length();if(distance<0.001)return;
    const axis=delta.divideScalar(distance);
    const L=Math.max(0.20,(distance+0.026)*0.5);
    armLengths(v,a,mix(0.20,L,weight));
    // 팔꿈치는 바깥·아래쪽으로 빠진다.
    const pole=new THREE.Vector3(a.s*0.9,-0.45,0.20).projectOnPlane(axis);
    if(pole.lengthSq()<0.00001)pole.set(a.s,0,0).projectOnPlane(axis);
    pole.normalize();
    const elbow=origin.clone().addScaledVector(axis,distance*0.5)
      .addScaledVector(pole,Math.sqrt(Math.max(0,L*L-distance*distance*0.25)));
    const q1=new THREE.Quaternion().setFromUnitVectors(down,elbow.clone().sub(origin).normalize());
    const fore=target.clone().sub(elbow).normalize();
    const q2=new THREE.Quaternion().setFromUnitVectors(down,fore.clone().applyQuaternion(q1.clone().invert()));
    a.sh.quaternion.slerp(q1,weight);a.el.quaternion.slerp(q2,weight);
    // 손바닥(-Z)은 얼굴을 향하고, 손가락(-Y)은 이마 쪽을 향한다.
    const center=v.torso.worldToLocal(v.headMesh.getWorldPosition(zero()));
    const fingerPoint=v.torso.worldToLocal(v.headMesh.localToWorld(
      p.clone().add(new THREE.Vector3(-a.s*0.03,0.12,-0.01))
    ));
    const y=fingerPoint.sub(target).normalize().negate();
    const z=target.clone().sub(center).projectOnPlane(y).normalize();
    if(z.lengthSq()>0.001) {
      const x=y.clone().cross(z).normalize();z.copy(x.clone().cross(y).normalize());
      const worldQ=new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,y,z));
      const local=q1.clone().multiply(q2).invert().multiply(worldQ);
      a.hand.quaternion.slerp(local,weight);
    }
  }

  function floorY(v,f) {
    v.root.updateMatrixWorld(true);
    let low=Infinity;
    for(const m of f.support) {
      if(!visible(m,v.root))continue;
      const p=m.geometry?.attributes.position;
      if(!p)continue;
      const e=m.matrixWorld.elements;
      // Exact mesh vertices, not an oversized bounding box that makes the body float.
      for(let i=0;i<p.count;i++) {
        const y=e[1]*p.getX(i)+e[5]*p.getY(i)+e[9]*p.getZ(i)+e[13];
        if(y<low)low=y;
      }
    }
    for(const a of v.armRig) {
      const h=a.hand.getWorldPosition(tmp);
      low=Math.min(low,h.y-0.065*Math.max(0.3,v.look.bodyW));
    }
    return Number.isFinite(low)?low:CFG.floor;
  }

  function startFall(v,f,again=false) {
    prepareLegs(v,f);
    f.phase='fall';f.age=0;f.pending=false;f.coverTo=0;
    f.from=f.form.slice();
    if(!again) {
      v.root.updateMatrixWorld(true);
      const hip=v.body.localToWorld(new THREE.Vector3(0,0.5,0));
      f.x=hip.x;f.z=hip.z;
      f.side=Math.sign(v.root.rotation.z)||(Math.random()<0.5?-1:1);
      f.cover=f.coverTo=0;
      f.from=[0,clamp01(Math.abs(v.root.rotation.z)/(Math.PI/2))];
      f.form=f.from.slice();
    }
    v.state='down';v.stateT=0.35;v.root.visible=true;
    v.downFrom={x:v.root.position.x,z:v.root.position.z,rz:v.root.rotation.z};
    v.lieZ=f.side*Math.PI/2;
    v._guardV2=v._wipeV2=null;
  }
  function advance(f,dt) {
    f.age+=dt;f.quiet+=dt;
    f.cover=mix(f.cover,f.coverTo,1-Math.exp(-dt*7));
    f.recoil*=Math.exp(-dt*8);
    if(f.phase==='fall') {
      const c=smooth(f.age/0.70);
      const delay=f.from[1]>0.2?0:0.52;
      const r=smooth((f.age-delay)/(CFG.fallSeconds-delay));
      f.form=[mix(f.from[0],1,c),mix(f.from[1],1,r)];
      if(f.age>=CFG.fallSeconds){f.phase='rest';f.age=0;f.form=[1,1];}
    } else if(f.phase==='rest') {
      f.form=[1,1];
      if(f.quiet>=CFG.restSeconds){f.phase='rise';f.age=0;}
    } else if(f.phase==='rise') {
      const d=RISE_UNCURL*f.cover,t=clamp01((f.age/CFG.riseSeconds-d)/(1-d));
      f.form=[1-smooth((t-0.32)/0.68),1-smooth(t/0.42)];
      if(f.age>=CFG.riseSeconds){f.phase='stand';f.form=[0,0];f.cover=f.coverTo=0;f.grace=CFG.graceHits;}
    }
  }




function pose(v,f) {
  if(!f.legs)prepareLegs(v,f);
  const crouch=f.form[0], roll=f.form[1];
  const r=f.phase==='rise'
    ?clamp01(f.age/CFG.riseSeconds)
    :0;

  const cover=f.cover*(1-smooth(r/0.5));
  // 쓰러진 뒤 더 맞으면 1까지 올라간다: 두 손으로 얼굴을 가리고, 다리를 접어 몸 쪽으로 웅크린다.
  // 일어날 때는 누운 채로 다리부터 편 다음에 몸을 세운다(접은 채로 세우면 공중에 뜬 것처럼 보인다).
  const curl=f.cover*crouch*(1-smooth(r/RISE_UNCURL));
  const t=G.time;
  const kick=Math.sin(t*38)*f.recoil;

  v.body.position.set(0,0,0);
  v.body.rotation.set(0,0,0);

  v.torso.position.y=0.5;
  v.torso.scale.set(1,1,1);
  v.torso.rotation.set(0.22*curl,0,0);   // 등을 살짝 만다

  v.head.position.y=v.headStandY();
  v.head.scale.set(1,1,1);
  v.headPivot.rotation.set(
    0.40*curl,                            // 턱을 당긴다
    0,
    Math.sin(t*19)*0.008*crouch+kick*0.015
  );

  for(const [i,leg] of f.legs.entries()) {
    leg.leg.rotation.set(
      -(i?1.62:1.82)*curl,                // 허벅지를 몸 앞으로 끌어올린다(몸통 속으로 파묻히지 않을 만큼만)
      0,
      (i?1:-1)*(0.05*crouch+0.10*curl)    // 두 무릎이 겹쳐 하나로 보이지 않게 살짝 벌린다
    );
    bendLeg(leg,(i?2.15:2.35)*curl);      // 무릎을 접어 발을 엉덩이 쪽으로 붙인다
  }

  for(const a of v.armRig) {
    armLengths(v,a,0.20);
    a.sh.rotation.set(-0.50-0.18*crouch,0,a.s*0.24);
    a.el.rotation.set(-0.60,0,0);
    a.hand.rotation.set(0,a.s*0.6,0);

  // 넘어지기 직전에도 앞이 아닌 옆으로만 살짝 기울인다.
  // 완전히 쓰러졌을 때는 정확히 옆으로 90도.
  const lean=0.045*crouch*(1-roll);

  // 웅크릴 때는 몸을 위쪽으로 조금 돌려 눕힌다. 옆으로 누운 채 정면에서만 보면
  // 접은 다리가 전부 몸통 뒤·속으로 들어가 보이기 때문에, 무릎이 몸 위로 올라와 보이게 한다.
  v.root.rotation.order='ZYX';
  v.root.rotation.set(
    0,
    f.side*CURL_ROLL*curl,
    f.side*(Math.PI/2*roll+lean)
  );

  v.root.position.set(0,0,0);
  v.root.updateMatrixWorld(true);

  const hip=v.body.localToWorld(
    new THREE.Vector3(0,0.5,0)
  );

  v.root.position.x=f.x-hip.x;
  v.root.position.z=f.z-hip.z;
  v.root.updateMatrixWorld(true);

  for(const a of v.armRig) {
    coverFace(v,a,cover*crouch);
  }

  // 몸이 바닥에 파묻히거나 뜨지 않도록 보정
  v.root.position.y+=CFG.floor-floorY(v,f);
  v.root.updateMatrixWorld(true);

  v.state='down';
  v.stateT=0.35+2.2*r;
  v.lieZ=f.side*Math.PI/2;
}

  // 선 채로 무릎을 접어 주저앉는 정도(0~1). 체어샷 내려찍기에서 쓴다.
  // deep(0~1): 허벅지를 수평까지 올리고 무릎을 끝까지 접어 엉덩이를 발뒤꿈치 가까이 내린다(바닥의 음식을 주울 때).
  function squat(v,amount,deep=0) {
    const f=ensure(v);
    if(f.phase!=='stand')return;
    amount=clamp01(amount);deep=clamp01(deep);
    if(amount<=0&&!(f.squat>0))return;
    if(!f.legs)prepareLegs(v,f);
    if(!(f.squat>0)) {
      for(const r of f.legs){r.leg.rotation.x=0;bendLeg(r,0);}
      v.root.position.y=0;
      f.standFloor=floorY(v,f);
    }
    f.squat=amount;
    for(const r of f.legs){

      // 겹쳐 셔츠 안으로 파묻혀 보인다.
      const side=Math.sign(r.leg.position.x)||1;
      r.leg.rotation.set(-(1.2+.34*deep)*amount,0,side*0.90*deep*amount);
      bendLeg(r,(2.25-.05*deep)*amount);

    v.root.position.y=0;
    v.root.position.y=f.standFloor-floorY(v,f);
    v.root.updateMatrixWorld(true);
  }






  function finish(v,f) {
    for(const leg of f.legs||[]) {bendLeg(leg,0);leg.leg.rotation.set(0,0,0);}f.squat=0;
    v.torso.rotation.set(0,0,0);v.torso.position.y=0.5;
    v.body.position.set(0,0,0);v.body.rotation.set(0,0,0);
    v.root.rotation.order='XYZ';v.root.rotation.set(0,0,0);v.root.position.y=0;
    v.state='stand';v.stateT=0;v.stagger=Math.max(v.stagger||0,0.7);
    for(const a of v.armRig)armLengths(v,a,0.20);
    v.root.updateMatrixWorld(true);
  }
  function tremble(v,f,dt) {
    const eligible=G.mode==='hit' && v.state==='stand' && !special(v) &&
      !G.social && !G.hug && !G.ptr?.grab && !G.ptr?.toolHold;
    const want=eligible?clamp01((marshmallowFatigue(v)-CFG.shakeAt)/(CFG.fullShakeAt-CFG.shakeAt)):0;
    f.shake=mix(f.shake,want,1-Math.exp(-dt*4));
    if(!eligible||f.shake<0.001)return;
    const t=G.time,k=f.shake*CFG.shakeScale;

      a.sh.rotation.x+=Math.sin(t*23+a.s)*0.05*k;
      a.el.rotation.x+=Math.sin(t*31+a.s)*0.10*k;

    v.headPivot.rotation.z+=Math.sin(t*29+0.8)*0.022*k;

  }

  const oldHit=applyHit;
  applyHit=function(h) {
    const v=G.v;if(!v)return oldHit.apply(this,arguments);
    const f = ensure(v),
      wasActive = active(v),
      beforeHits = v.st.hits,
      beforeDamage = marshmallowFatigue(v);
    const out=oldHit.apply(this,arguments);
    if(G.v!==v||v.st.hits<=beforeHits||h?.tool==='tissue'||h?.tool==='ground')return out;
    f.quiet=0;
    if(wasActive) {
      if(f.phase==='rest')f.coverTo=1;f.recoil=Math.min(1,(Number(h.power)||1)*0.30);
      // Chair/full-bat effects still execute, but a grounded actor does not get
      // teleported into a competing launch/recovery animation.
      v._impactV2=null;v._slapMotion=null;v._guardV2=v._wipeV2=null;
      const walls=scene.getObjectByName?.('chair-impact-side-walls');if(walls)walls.visible=false;
      v.root.visible=true;
      if(f.phase==='rise')startFall(v,f,true);
      pose(v,f);
    } else if(G.mode==='hit'&&beforeDamage>=CFG.collapseAt) {
      if(f.grace>0) f.grace--;   // 일어난 뒤 10대까지는 버틴다
      else {
        f.pending=true;
        // Finish an already-started chair flight / offscreen return first.
        if(!special(v))startFall(v,f);
      }
    }
    return out;
  };

  const oldUpdate=updateVillain;
  updateVillain=function(v,dt) {
    if(G.editing||document.hidden||document.querySelector('.modal:not([hidden])'))
      return;
    dt=Number.isFinite(dt)?Math.max(0,Math.min(dt,0.08)):0;
    const f=ensure(v);
    if (f.pending && marshmallowFatigue(v) < CFG.collapseAt) {
  f.pending = false;
}
    if(f.phase==='stand') {
      const out=oldUpdate(v,dt);
      if(G.v!==v)return out;
      if(f.pending&&!special(v)){startFall(v,f);pose(v,f);}
      else {
        // 내려찍기 동작이 중간에 끊겼으면 접힌 무릎을 편다.
        if(f.squat>0&&v._impactV2?.kind!=='press'){squat(v,0);f.squat=0;v.root.position.y=0;}
        tremble(v,f,dt);
      }
      return out;
    }
    if(['enter','exit'].includes(v.state)) {
      const state=v.state,age=v.stateT;
      f.phase='stand';finish(v,f);v.state=state;v.stateT=age;
      return oldUpdate(v,dt);

    // and the competing full-body pose are bypassed while this pose owns down.
    v.state='fatigue-base';
    let out;
    try {out=oldUpdate(v,dt);} finally {if(G.v===v)v.state='down';}
    if(G.v!==v)return out;
    advance(f,dt);
    if(f.phase==='stand')finish(v,f);else pose(v,f);
    return out;
  };

  // Dragging a downed body into the old ankle animation would steal the pose.
  // Normal taps/swings still use the original, hittable 'down' state.
  const oldGrab=startGrab;
  startGrab=function(...args){if(active(G.v))return false;return oldGrab.apply(this,args);};

  const oldDispose=Villain.prototype.dispose;
  Villain.prototype.dispose=function(...args){data.delete(this);return oldDispose.apply(this,args);};
  // 외모를 바꿀 때: 다리가 접힌 채로 바뀌면 접힌 모양이 새 '기본 모양'으로 잡혀 영영 안 펴진다.
  // 그래서 먼저 다리를 펴 놓고 외모를 바꾼 다음, 접힘 계산에 쓰던 기록을 새로 만든다(누워 있으면 다음 프레임에 다시 접힌다).
  const oldLookF=Villain.prototype.applyLook;
  Villain.prototype.applyLook=function(...args){
    const f=data.get(this);
    if(f?.legs)for(const r of f.legs){bendLeg(r,0);r.leg.rotation.set(0,0,0);}
    const out=oldLookF.apply(this,args);
    if(f){f.legs=null;f.support=[];f.squat=0;}
    return out;
  };
  if(window.__api)Object.assign(window.__api,{applyHit,updateVillain,startGrab});
  window.__SC_LEGS={squat};
  window.__SC_FATIGUE_V1={config:CFG,active,
    inspect:()=>{const f=G.v&&data.get(G.v);return f?{phase:f.phase,quiet:f.quiet,cover:f.cover,pending:f.pending}:null;}
  };
})();

/* SC_DIALOGUE_NAME_V2_BEGIN */
(() => {
  'use strict';
  if(window.__SC_DIALOGUE_NAME_V2)return;


  const labels=new WeakMap();
  Villain.prototype.drawName=function() {
    const {g,t}=this.nameTex;
    if(g.canvas.width!==640)g.canvas.width=640;
    const W=g.canvas.width,H=g.canvas.height;
    const chars=Array.from(String(this.look.name||'나 자신').replace(/\s+/g,''));
    if(!chars.length)chars.push('나','쁜','놈');
    g.clearRect(0,0,W,H);
    const size=Math.min(W*0.84,H*0.94/(chars.length*1.04));
    const line=size*1.04,top=(H-line*chars.length)/2+line/2;
    g.font=`${size}px "Black Han Sans","Gothic A1","Malgun Gothic",sans-serif`;
    g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
    g.lineWidth=Math.max(5,size*0.075);g.strokeStyle='#fffdf4';g.fillStyle='#1f2a5c';
    chars.forEach((ch,i)=>{g.strokeText(ch,W/2,top+i*line,W-35);g.fillText(ch,W/2,top+i*line,W-35);});
    t.needsUpdate=true;
  };

  // Cache where each label vertex sits on the actual front-facing garment
  // triangle. Reuse the weights as cloth dents move; no per-frame raycasts.
  function planLabel(core,uv) {
    const p=core.geometry.attributes.position,ix=core.geometry.index;
    const n=ix?ix.count:p.count,at=i=>ix?ix.getX(i):i;
    const plan=[];
    for(let q=0;q<uv.count;q++) {
      const x=(uv.getX(q)-0.5)*0.275;
      const y=0.035+uv.getY(q)*0.435;
      let best=null,zBest=-Infinity;
      for(let j=0;j<n;j+=3) {
        const a=at(j),b=at(j+1),c=at(j+2);
        const ax=p.getX(a),ay=p.getY(a),bx=p.getX(b),by=p.getY(b),cx=p.getX(c),cy=p.getY(c);
        const d=(by-cy)*(ax-cx)+(cx-bx)*(ay-cy);
        if(Math.abs(d)<1e-10)continue;
        const u=((by-cy)*(x-cx)+(cx-bx)*(y-cy))/d;
        const v=((cy-ay)*(x-cx)+(ax-cx)*(y-cy))/d,w=1-u-v;
        if(u < -1e-5||v < -1e-5||w < -1e-5)continue;
        const z=u*p.getZ(a)+v*p.getZ(b)+w*p.getZ(c);
        if(z>zBest){zBest=z;best={a,b,c,u,v,w};}
      }
      plan.push(best||{x,y,z:0.18});
    }
    return plan;
  }
  function centerLabel(v) {
    const c=v._bodyCloth,tag=c?.tag,core=c?.core;
    if(!tag||!core)return;
    const p=tag.geometry.attributes.position,uv=tag.geometry.attributes.uv;
    let cache=labels.get(v);
    if(!cache||cache.geo!==core.geometry||cache.label!==tag.geometry) {
      cache={geo:core.geometry,label:tag.geometry,plan:planLabel(core,uv),version:-1};
      labels.set(v,cache);
    }
    // followAccessories() may have rewritten the old, left-aligned positions.
    // A version guard skips this work when neither that nor the cloth changed.
    if(cache.version===p.version&&cache.cloth===core.geometry.attributes.position.version)return;
    const source=core.geometry.attributes.position;
    tag.position.set(0,0,0);tag.rotation.set(0,0,0);tag.scale.set(1,1,1);
    for(let i=0;i<p.count;i++) {
      const a=cache.plan[i];
      if(a.a===undefined){p.setXYZ(i,a.x,a.y,a.z+0.012);continue;}
      p.setXYZ(i,
        source.getX(a.a)*a.u+source.getX(a.b)*a.v+source.getX(a.c)*a.w,
        source.getY(a.a)*a.u+source.getY(a.b)*a.v+source.getY(a.c)*a.w,
        source.getZ(a.a)*a.u+source.getZ(a.b)*a.v+source.getZ(a.c)*a.w+0.012);

  const launch=planePoint(innerWidth*.66,Math.max(top+105,Math.min(innerHeight*.39,dock.top-130)),.76);
  const wind=launch.clone().add(V3(.20,.22,.40));
  const direction=target.clone().sub(launch).normalize();
  const follow=launch.clone().addScaledVector(direction,.48).add(V3(-.18,-.24,.015));

}

    const u=easeOut(clamp((t-NG4_THROW_RELEASE)/(.28-NG4_THROW_RELEASE),0,1));p.copy(a.launch).lerp(a.follow,u);

        // 귓볼이 없을수록 귀 아래쪽을 머리에 붙여 없앤다. 아래로 처진 부분을 끌어올리고,
        // 바깥으로 나온 두께와 앞뒤 폭을 함께 줄여 굴곡 없이 볼로 이어지게 한다.
        const melt=(1-clamp(L.earLobe/.55,0,1))*low;
        p.setXYZ(i,(x*.67*(1-L.earPoint*.64*tip)+back)*(1-.78*melt),y*(1+L.earPoint*.52*tip+L.earLobe*.18*low-.28*melt),z*.40*(1-.82*melt));
      }
      p.needsUpdate=true;m.geometry.computeVertexNormals();m.geometry.computeBoundingSphere();
      m.scale.setScalar(L.earSize);
      e.inner.position.set(back,.004,.023);e.inner.scale.set(.52,.83,.19);
      e.inner.visible=true;
      if(!e.lobe){e.lobe=mesh(new THREE.SphereGeometry(.025,14,10),v.skinMat,m);}
      const lob=clamp(L.earLobe/.55,0,1);
      e.lobe.visible=lob>.01;
      e.lobe.position.set(back*(.25+.75*lob),-.056-.012*L.earLobe,.003);
      e.lobe.scale.set((.82+.10*L.earLobe)*lob,(.45+L.earLobe*.72)*lob,.55*lob);
      const anchor=v.anchor.find(a=>a.obj===m);
      if(anchor){anchor.d.copy(dirN(e.s,L.earY,-.05));m.userData.oriented=false;}
    }
  }
  function shapeNose(v){
    const L=v.look,m=v.noseM,p=m.geometry.attributes.position;
    if(!v._ngNoseBase||v._ngNoseGeo!==m.geometry){v._ngNoseGeo=m.geometry;v._ngNoseBase=Float32Array.from(p.array);}
    const b=v._ngNoseBase;
    for(let i=0;i<p.count;i++){
      const x=b[i*3],y=b[i*3+1],z=b[i*3+2];
      const alar=Math.exp(-Math.pow((y+.023)/.034,2));
      p.setXYZ(i,x*(1+(L.nostrilWidth-1)*alar),y,z);
    }
    p.needsUpdate=true;m.geometry.computeVertexNormals();m.geometry.computeBoundingSphere();
    // Existing nostril meshes follow the new alar width, without growing the whole tip.
    for(let i=0;i<2;i++){const n=m.children[i];if(n)n.position.x=(i?1:-1)*.022*L.nostrilWidth;}
    if(!v._ngNoseBridge){
      const b=mesh(new THREE.SphereGeometry(1,20,16),v.noseMat,v.noseG);b.userData.part='nose';
      v._ngNoseBridge=b;if(v.parts&&!v.parts.includes(b))v.parts.push(b);
    }
    const bridge=v._ngNoseBridge;
    bridge.position.set(0,.047,.008+.032*L.bridgeHeight);
    bridge.scale.set(.023*L.nose,.057*L.nose,.012+.033*L.bridgeHeight);
  }
  const oldLook=Villain.prototype.applyLook;
  Villain.prototype.applyLook=function(...args){
    const result=oldLook.apply(this,args);
    shapeEars(this);shapeNose(this);installEyeMask(this);
    this.headDirty=true;this.applyDeform();this.captureResources();actors.add(this);syncEyeMask(this);
    return result;
  };
  const oldDispose=Villain.prototype.dispose;
  Villain.prototype.dispose=function(...args){actors.delete(this);return oldDispose.apply(this,args);};
  const oldRender=renderer.render;
  renderer.render=function(sc,cam){
    for(const v of actors)if(v.hostScene===sc)syncEyeMask(v);
    if(window.__game&&window.__game.v&&window.__game.v.hostScene===sc)window.__SC_HYGIENE&&window.__SC_HYGIENE.followLegs(window.__game.v);
    return oldRender.call(this,sc,cam);
  };
  const oldStep=step;
  step=function(dt){
    const r=oldStep.apply(this,arguments);
    if(!G.hug||G.editing||G.mode!=='care')ngEndHugPose();
    flushLateFX();
    return r;
  };
  // Keep test hooks local. No telemetry or names are sent anywhere.
  window.__NG4={version:'NG4_20260919',throwRelease:NG4_THROW_RELEASE,
    inspect:()=>({histories:{player:[...RECENT_DIALOGUE.player],character:[...RECENT_DIALOGUE.character]},
      avoidance:PREF.avoid,rubCount:SFX._rubCount||0,actors:actors.size,
      careDelay:G.react?.delay??null,careReplyFired:!!G.react?.fired,shape:G.v?{...G.v.look}:null}),
    syncEyes:syncEyeMask};
  if(window.__api)Object.assign(window.__api,{step,careRub,careSay,queueCareReply,updateCareReply,SFX,RECENT_DIALOGUE,
    chooseDialogue,dialogueCandidates,pickCharacterLine,ngThrowPath,ngThrowPose,ngPoseHug,ngEndHugPose,normaliseLook});
})();

/* ================= 시작 ================= */
function boot() {
  fit();
  newVillain();
  // 처음 온 기기: 입장 연출 대신 기본 외모로 세워 두고 나를 떠올리기부터 띄운다. 한 번 열어 본 기기는 건너뛴다.
  const firstVisit = !APPEAR.seen;
  if (firstVisit) { const v = G.v; v.state = 'stand'; v.stateT = 0; v.root.position.set(0, 0, 0); v.root.rotation.set(0, 0, 0); }
  else { $('#ngIntro').hidden = true; document.body.classList.remove('ng-intro'); }
  requestAnimationFrame(t => { lastT = t; frame(t); });
  window.__game=G;window.__refreshGameFonts=()=>{document.fonts.ready.then(()=>{if(G.v)G.v.drawName();});};
  document.fonts?.ready?.then(()=>{bandCache.key='';fit();});window.__bootGuard.ready=true;$('#fallback').style.display='none';
  if (firstVisit) window.__NG2.beginIntro();
  setHint();   // 편집기가 떠 있으면 안내문은 닫은 뒤에 뜬다
}
if (document.fonts && document.fonts.ready) {
  let done = false;
  const go = () => { if (done) return; done = true; boot(); };
  document.fonts.ready.then(go); setTimeout(go, 1500);
} else boot();

</script>
<script>
(function(){
  let run=false;
  function start(){if(run)return;run=true;try{const s=document.createElement('script');s.textContent=document.getElementById('gameSource').textContent;document.body.appendChild(s);}catch(e){window.showGameError('게임을 시작하지 못했어요.',e.message);}}
  const sources=['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js','https://unpkg.com/three@0.128.0/build/three.min.js'];
  function load(i){if(window.THREE){start();return;}if(i>=sources.length){window.showGameError('3D 엔진을 불러오지 못했어요.','인터넷 연결이나 외부 콘텐츠 허용 상태를 확인한 뒤 다시 열어 주세요. 저장된 외모는 지워지지 않았어요.');return;}
    const script=document.createElement('script');let settled=false;const end=()=>{if(settled)return;settled=true;clearTimeout(timer);script.onload=script.onerror=null;if(window.THREE)start();else{script.remove();load(i+1);}};
    script.src=sources[i];script.crossOrigin='anonymous';script.onload=end;script.onerror=end;const timer=setTimeout(end,4500);document.head.appendChild(script);
  }
  load(0);
})();
</script>
